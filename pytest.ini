[pytest]
testpaths = tests

# ── Canal de advertencias ────────────────────────────────────────────────────
# Un canal con 637 avisos de una clase conocida y benigna es un canal inútil:
# cualquier advertencia NUEVA y real queda invisible. Es la misma patología del
# test permanentemente rojo — lo que se normaliza, se esconde.
#
# Por eso se silencia EXPLÍCITAMENTE lo conocido, con su razón y su fecha de
# revisión, y NO se silencia nada más. Filtrar en bloque sería cambiar un canal
# ruidoso por uno sordo.
filterwarnings =
    # SQLAlchemy 2.0 marcó Modelo.query.get(id) como legacy ("long term
    # deprecation" — funciona y seguirá funcionando un buen rato). Hay 224
    # llamadas en app/. Migrar a db.session.get(Modelo, id) es mecánico pero
    # toca todo el backend: tarde tranquila DESPUÉS del comité del 7-ago-2026,
    # no entre el go-live y la decisión más cara del año.
    # El trinquete de tests/test_deuda_legacy.py impide que el número crezca.
    # REVISAR: septiembre 2026.
    ignore::sqlalchemy.exc.LegacyAPIWarning
