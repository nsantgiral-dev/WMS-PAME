[build]
builder = "nixpacks"
buildCommand = """python -m pytest tests/ -x -v --tb=long \
  --deselect=tests/test_10_traslados.py::TestConnektaGatewayTraslados::test_173079_bodega_salida_es_transito_no_origen \
  --ignore=tests/test_09_guards_criticos.py \
  2>&1 | grep -E 'FAILED|PASSED|ERROR|assert|Error|Exception' | tail -20"""

[deploy]
startCommand = "gunicorn wsgi:app --workers=1 --threads=4 --timeout=120"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
