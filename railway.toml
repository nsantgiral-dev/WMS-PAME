[build]
builder = "nixpacks"
buildCommand = "python -m pytest tests/ -x -q --tb=short -m \"not postgres\""

[deploy]
releaseCommand = "flask db upgrade"
startCommand = "gunicorn wsgi:app --workers=2 --threads=4 --timeout=60 --preload"
# healthcheck configurado en Railway UI por servicio
# (el worker no tiene healthcheck, el web sí)
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
