[build]
builder = "nixpacks"
buildCommand = """python -m pytest tests/ -x -q --tb=short \
  --deselect=tests/test_09_guards_criticos.py::TestFallbackCondPagoAlerta::test_fallback_dispara_email_cuando_cond_pago_vacio \
  --deselect=tests/test_10_traslados.py::TestConnektaGatewayTraslados::test_173079_ubicacion_aux_ent_siempre_none_aunque_item_tenga_ubicacion \
  --deselect=tests/test_10_traslados.py::TestConnektaGatewayTraslados::test_173079_ubicacion_aux_ent_siempre_none_aunque_haya_default \
  --deselect=tests/test_10_traslados.py::TestConnektaGatewayTraslados::test_173079_bodega_salida_es_transito_no_origen \
  --deselect=tests/test_10_traslados.py::TestFixesSesion20260611::test_ets_ubicacion_aux_ent_ninguna_variante_sale_con_valor"""

[deploy]
startCommand = "gunicorn wsgi:app --workers=1 --threads=4 --timeout=120"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
